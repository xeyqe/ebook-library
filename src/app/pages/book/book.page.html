<div class="header">
    @if (isEditing()) {
        <button type="button" mat-mini-fab (click)="deleteBook()">
            <mat-icon>delete</mat-icon>
        </button>
    } @else {
        <div class="wdth"></div>
        <ion-title>book</ion-title>
    }

    @if (book) {
        <div class="buttons">
            @if (!isEditing()) {
                <button type="button" mat-mini-fab (click)="onGo2('speech')">
                    <mat-icon>campaign</mat-icon>
                </button>
                <button type="button" mat-mini-fab (click)="onGo2('spritz')">
                    <mat-icon>auto_stories</mat-icon>
                </button>
            }
            @if (bookChanged && isEditing()) {
                <button type="button" mat-mini-fab (click)="updateBook()">
                    <mat-icon>save</mat-icon>
                </button>
            }

            <button type="button" mat-mini-fab (click)="editable()">
                <mat-icon>{{ isEditing() ? 'clear' : 'edit' }}</mat-icon>
            </button>

            @if (isEditing()) {
                @if (showOnlineSearch) {
                    <button type="button" mat-mini-fab (click)="onlineSearch()?.search()">
                        <mat-icon>add_circle</mat-icon>
                    </button>
                }
                @if (book.path.substring(book.path.length - 4) === 'epub') {
                    <button type="button" class="upper" mat-mini-fab (click)="getMetadataFromEpub()">EPUB</button>
                }
            }
        </div>
    }
</div>

<div class="spaced" #content>
    @if (book) {
        <div>
            <app-library-picture
                [imageControl]="bookForm.controls.img"
                [owner]="{
                    type: 'book',
                    id: book.id,
                    path: book.path,
                    title: book.title,
                    editedTitle: bookForm.controls.title.value,
                }"
                [images]="suggestions.img"
                [editing]="isEditing()" />
            <app-book-details [form]="bookForm" [suggestions]="suggestions" [editing]="isEditing()" />
            <app-book-online-search
                [hidden]="!isEditing()"
                [form]="bookForm"
                [book]="book"
                (dataSelected)="onOnlineData($event)" />
        </div>
    }
</div>
