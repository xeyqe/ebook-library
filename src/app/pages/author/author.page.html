<div class="header">
    @if (isEditing()) {
        <button type="button" mat-mini-fab (click)="deleteAuthor()">
            <mat-icon>delete</mat-icon>
        </button>
    } @else {
        <div class="wdth"></div>
        <h2>author</h2>
    }
    <div class="col text-right">
        @if (authorChanged && isEditing()) {
            <button type="button" mat-mini-fab (click)="onUpdateAuthor()">
                <mat-icon>save</mat-icon>
            </button>
        }
        <button type="button" mat-mini-fab [disabled]="!author" (click)="onEditable()">
            <mat-icon>{{ isEditing() ? 'clear' : 'edit' }}</mat-icon>
        </button>

        @if (isEditing() && showOnlineSearch) {
            <button type="button" mat-mini-fab (click)="onlineSearch()?.search()">
                <mat-icon>add_circle</mat-icon>
            </button>
        }
    </div>
</div>

<div class="spaced" #content>
    @if (author) {
        <div>
            <app-library-picture
                [imageControl]="authorForm.controls.img"
                [owner]="{
                    type: 'author',
                    path: author.path,
                    name: authorForm.controls.name.value,
                    surname: authorForm.controls.surname.value,
                }"
                [images]="suggestions.img"
                [editing]="isEditing()"
                (operationFinished)="scrollToContent()" />
            <app-author-details [form]="authorForm" [suggestions]="suggestions" [editing]="isEditing()" />
            <app-author-books
                [author]="author"
                [books]="books"
                [series]="series"
                [imagePrefix]="imgPreLink"
                (bookAdded)="onBookAdded($event)" />
            <app-author-online-search
                [hidden]="!isEditing()"
                [form]="authorForm"
                (dataSelected)="onOnlineData($event)" />
        </div>
    }
    @if (!isEditing()) {
        <div class="ad-bu-cont">
            <button type="button" mat-mini-fab [disabled]="!author" (click)="bookList()?.addBooks()">
                <mat-icon>add_circle</mat-icon>
            </button>
        </div>
    }
</div>
