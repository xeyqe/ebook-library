<div class="pic-container">
    @if (editing()) {
        <div class="bu-change-pic">
            @if (onDownloadBuVisible(form().controls.img.value)) {
                <button type="button" mat-mini-fab (click)="onDownloadPicture()">
                    <mat-icon>download_for_offline</mat-icon>
                </button>
            }
            @if (form().controls.img.value?.at(0) === '/') {
                <button type="button" mat-mini-fab (click)="onRemovePic()">
                    <mat-icon>remove_circle</mat-icon>
                </button>
            }
            <button type="button" mat-mini-fab (click)="onAddPicture()">
                <mat-icon>add_circle</mat-icon>
            </button>
        </div>
        <app-picture
            [imgPreLink]="imagePrefix()"
            [images]="images()"
            [dirPath]="path()"
            (changeEvent)="onPicChanged($event)">
        </app-picture>
    }

    @if (form().controls.img.value && !editing()) {
        <img height="auto" width="auto" [src]="onGetImgSrc(form().controls.img.value)" alt="img" />
    }
</div>
