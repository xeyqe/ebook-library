@if (editing() || imageValue()) {
    <div class="pic-container">
        @if (editing()) {
            <div class="bu-change-pic">
                @if (imageValue() && !imageValue().startsWith('/') && !imageValue().startsWith('file://')) {
                    <button type="button" mat-mini-fab (click)="downloadPicture()">
                        <mat-icon>download_for_offline</mat-icon>
                    </button>
                }
                @if (canRemovePicture()) {
                    <button type="button" mat-mini-fab (click)="onRemovePic()">
                        <mat-icon>remove_circle</mat-icon>
                    </button>
                }
                <button type="button" mat-mini-fab (click)="onAddPicture()">
                    <mat-icon>add_circle</mat-icon>
                </button>
            </div>
            <app-picture
                [imgPreLink]="dir.imgPreLink()"
                [(images)]="displayImages"
                [dirPath]="directory()"
                (changeEvent)="onPicChanged($event)" />
        } @else {
            <img height="auto" width="auto" [src]="onGetImgSrc(imageValue())" alt="img" />
        }
    </div>
}
